# Loreley の compose 構成(MVP: OpenSearch・Indexer・Crawler・api・web)。
#
# 起動(このディレクトリで実行。.env は任意。無くても既定値で動く):
#   docker compose up -d --build
#   (`--wait` は使わない。compose v2.3.3 では、opensearch-init が正常終了(Exited)したあとも
#    戻ってこないことを確認した。起動完了は `docker compose ps` の healthy で確認する。
#    待機つきの起動は scripts/run-indexer-integration-test.sh を参照)
#   crawler は、検索対象のディレクトリ(.env の CRAWLER_DOCUMENTS_DIR。既定は ./documents)を
#   読み取り専用で mount する。Indexer だけを起動したいときは、サービス名を指定する:
#   docker compose up -d --build opensearch opensearch-init indexer
#   api は opensearch と opensearch-init だけを待つ(crawler・indexer が落ちていても起動する)。
#   web は api の healthy を待つ。api は web を待たない(web が落ちていても api は起動する)。
#   起動直後は、crawler・indexer・web が接続できるようになるまで、api の画面の状態は「異常」に見える(設計書の記述。実機未確認)。
# 停止(データは残す): docker compose down
# 停止(データも消す): docker compose down -v
#
# 対象の docker compose は v2.3.3 以降。古い版でも解釈できるよう、`version:` や `name:` は
# 書かない(プロジェクト名は `-p` で指定する。未指定ならディレクトリ名 `compose` になる)。
#
# 公開範囲(重要):
#   Indexer API・Crawler API・api(Admin API)・web(api へのプロキシ)には認証・認可がなく(Indexer は `DELETE` でソースの
#   文書の全削除、Crawler と api はクロール・ソース削除ジョブの起動、ロック解放、設定の登録・更新まで
#   呼べる)、OpenSearch もセキュリティプラグインを無効にしている(認証・TLS なし)。
#   そのため、ホストへの publish は必ず 127.0.0.1(ループバック)に限る。`0.0.0.0` を省いた
#   `ports: "9200:9200"` のような書き方は、全 NIC に公開されるので使わない。
#   コンテナ間はこのファイルが作る内部ネットワークで、サービス名(opensearch)で通信する。
#   Crawler は設計書(crawler-architecture 10章)のとおり、ホストに公開しない(ports なし)。
#   Crawler API は、FileSystem Connector の root にコンテナ内の任意のパスを登録でき、認証もないため。
#   結合テストの pytest だけは、tests/integration/crawler/compose.test.yaml がループバックに publish する。
#   Admin View と Admin API のホスト側の入口は web に一本化する。web は 127.0.0.1 にだけ publish し、
#   /api/ を api に中継する。web に到達できる全員が、認証なしで破壊的操作を実行でき、ブラウザ経由の
#   書き込みへの保護もない。api は本番用のこのファイルでは publish しない(ports なし)。内部ネットワークのサービス名(api:8080)で
#   だけ到達できる。結合テストの pytest だけは、tests/integration/api/compose.test.yaml が
#   ループバックに publish する。
#
# 上限・索引名の同値定義(重要):
#   Crawler は起動時に、自分の上限値(原本 1 件・バッチ・last-seen の件数など)が Indexer の上限
#   以下であることを検査し、超えていると起動に失敗する。そのため Indexer の上限 6 項目
#   (INDEXER_MAX_RAW_BYTES など)は、Indexer の `LORELEY_INDEXER_*` と Crawler の
#   `LORELEY_CRAWLER_INDEXER_*` に、同じ変数・同じ既定値(Indexer のコードの既定値)を渡す。
#   値を変えるときは、同じ変数 1 か所を変えれば両方に反映される。
#   `loreley-jobs` の索引名(LORELEY_JOBS_INDEX_NAME)も、opensearch-init・Indexer・Crawler・api に
#   同じ変数を渡す(Indexer はロックとメンテナンスフラグをここから読む)。
#   `loreley-sources`(LORELEY_SOURCES_INDEX_NAME)は opensearch-init・Crawler・api に、
#   `loreley-deletions`(LORELEY_DELETIONS_INDEX_NAME)は opensearch-init・Indexer・api に、
#   検索インデックスのエイリアス(LORELEY_SEARCH_INDEX_ALIAS)は opensearch-init・Indexer・api に渡す。
#   opensearch-init の SEARCH_INDEX_NAME は実体名(loreley-documents-000001)で別物なので、
#   Indexer・api には渡さない(再インデックスでエイリアスを付け替えたあと、古い索引を読まないため)。
#
# Crawler と api の同値定義(重要):
#   cron のタイムゾーン(LORELEY_CRON_TIMEZONE)と、受付途中のロックの猶予
#   (LORELEY_ADMITTING_LOCK_GRACE_SECONDS)は、Crawler と api に同じ変数を渡す。ずれると、画面の表示と
#   実際の実行時刻、ロック状態の表示と Crawler の拒否が食い違う(データは壊れない)。
#   api は Crawler の値を読めないので、この変数で揃える。

services:
  opensearch:
    # バージョンは .env の OPENSEARCH_VERSION で変える。既定はパッチまで固定した 3.9.0。
    # `latest` は、取得のたびにバージョンが変わり再現できないため使わない。
    # 3.9.0 は、opensearch-py 3.2.0(Indexer の依存)との組み合わせで、結合テストが通ることを確認した版。
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.9.0}
    environment:
      # 単一ノード。クラスタ形成(discovery)を待たずに起動し、ブートストラップチェックも
      # 本番モードの強制対象にならない(MVP は単一ホスト・単一ノード)。
      discovery.type: single-node
      # 認証なしで使う(MVP は認証なし。公開範囲はループバックのみに絞って補う)。
      DISABLE_SECURITY_PLUGIN: "true"
      # セキュリティを無効にするので、デモ用の証明書・ユーザーを生成する処理も不要。
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # ヒープは Xms と Xmx を同じ値にする(実行中のヒープ伸縮を避ける)。
      # 既定の 512m は、Docker VM のメモリが約 4GB の環境で OOM(exit 137)を避けるための値。
      # 文書量が増えたら .env の OPENSEARCH_HEAP_SIZE で増やす(VM のメモリの半分以下を目安にする)。
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP_SIZE:-512m} -Xmx${OPENSEARCH_HEAP_SIZE:-512m}
    ulimits:
      # 開いてよいファイル数。OpenSearch は 65535 以上を要求する(公式の Docker 手順と同じ値)。
      # Docker の既定値が環境で異なるため、明示して環境差をなくす。
      nofile:
        soft: 65536
        hard: 65536
      # memlock(メモリのスワップ防止)は設定しない。memlock が要るのは bootstrap.memory_lock=true を
      # 使うときだけで、MVP は使わない(単一ホストで Docker VM にスワップがほぼなく、設定を増やす利点が
      # 小さい)。使うなら `memlock: {soft: -1, hard: -1}` とあわせて有効にする。
    # Docker デーモンやホストの再起動、OOM(exit 137)で落ちたあとに戻すため。indexer だけ
    # 再起動すると、OpenSearch に到達できずに終了と再起動を繰り返す。
    # `depends_on` の待機は `up` のときにしか効かない。
    restart: unless-stopped
    ports:
      # ループバックのみ。ホスト側ポートは .env の OPENSEARCH_HOST_PORT で変えられるが、
      # バインドは常に 127.0.0.1。9600(Performance Analyzer)は使わないので publish しない。
      - "127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      # インデックスと Store 層のデータ。`down` では残り、`down -v` で消える。
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # yellow は「全プライマリシャードが割り当て済み」で、読み書きできる最低ライン。単一ノードでは
      # レプリカを置けず、green を待つと永久に healthy にならないことがあるため、green は求めない。
      # クラスタが応答するまで最大 5 秒待つ。
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 12
      # JVM の起動に時間がかかるので、この間の失敗は unhealthy に数えない(成功すれば即 healthy)。
      start_period: 60s

  opensearch-init:
    # インデックスを一度だけ作る使い捨てコンテナ。Indexer はインデックスを作らないので、
    # Indexer の起動前に完了させる。同じイメージを使うのは、curl と sh が入っていて追加の
    # イメージ取得が要らないため。
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.9.0}
    # イメージ既定の entrypoint は OpenSearch 本体を起動するので、init スクリプトに置き換える。
    # スクリプトは sh に渡して実行するため、mount した側の実行権限には依存しない。
    entrypoint: ["/bin/sh", "/init/init-indices.sh"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      SCHEMA_DIR: /init/schema
      # Indexer・Crawler が使う索引名と同じ値にする(ファイル冒頭の「上限・索引名の同値定義」)。
      JOBS_INDEX_NAME: ${LORELEY_JOBS_INDEX_NAME:-loreley-jobs}
      SOURCES_INDEX_NAME: ${LORELEY_SOURCES_INDEX_NAME:-loreley-sources}
      DELETIONS_INDEX_NAME: ${LORELEY_DELETIONS_INDEX_NAME:-loreley-deletions}
      # エイリアス(SEARCH_INDEX_NAME は init が作る実体名で、ここでは設定しない。既定のまま)。
      SEARCH_INDEX_ALIAS: ${LORELEY_SEARCH_INDEX_ALIAS:-loreley-documents}
    volumes:
      # スキーマと init スクリプトは、イメージに焼かず読み取り専用で mount する(変更が再ビルド不要で、
      # コンテナ側から書き換えられない)。
      - ../../infra/opensearch:/init:ro
    depends_on:
      opensearch:
        condition: service_healthy
    # 成功したら終了したままにする(スクリプトは冪等なので、再度 `up` しても何も壊さない)。
    restart: "no"

  indexer:
    build: ../../apps/indexer
    environment:
      # 接続先。認証・TLS なしの OpenSearch に、内部ネットワークのサービス名で接続する。
      LORELEY_INDEXER_OPENSEARCH_URL: http://opensearch:9200
      LORELEY_INDEXER_LOG_LEVEL: ${INDEXER_LOG_LEVEL:-INFO}
      # 要約生成は無効。LLM プロバイダが未実装で、true にすると起動に失敗する。
      LORELEY_INDEXER_SUMMARY_ENABLED: "false"
      # Crawler と同じ値にする(ファイル冒頭の「上限・索引名の同値定義」)。
      LORELEY_INDEXER_JOBS_INDEX_NAME: ${LORELEY_JOBS_INDEX_NAME:-loreley-jobs}
      LORELEY_INDEXER_DELETIONS_INDEX_NAME: ${LORELEY_DELETIONS_INDEX_NAME:-loreley-deletions}
      # 検索インデックスの名前には、実体名でなくエイリアスを渡す(opensearch-init の SEARCH_INDEX_ALIAS と同じ値)。
      LORELEY_INDEXER_SEARCH_INDEX_NAME: ${LORELEY_SEARCH_INDEX_ALIAS:-loreley-documents}
      # 上限。既定値は Indexer のコードの既定値と同じ(apps/indexer の config.py)。
      LORELEY_INDEXER_MAX_RAW_BYTES: ${INDEXER_MAX_RAW_BYTES:-20971520}
      LORELEY_INDEXER_MAX_BATCH_DOCUMENTS: ${INDEXER_MAX_BATCH_DOCUMENTS:-50}
      LORELEY_INDEXER_MAX_BATCH_BYTES: ${INDEXER_MAX_BATCH_BYTES:-67108864}
      LORELEY_INDEXER_MAX_REQUEST_BODY_BYTES: ${INDEXER_MAX_REQUEST_BODY_BYTES:-104857600}
      LORELEY_INDEXER_MAX_LAST_SEEN_IDS: ${INDEXER_MAX_LAST_SEEN_IDS:-1000}
      LORELEY_INDEXER_SKIP_OVERSIZE_ID_LIMIT: ${INDEXER_SKIP_OVERSIZE_ID_LIMIT:-10000}
    depends_on:
      opensearch:
        condition: service_healthy
      # インデックスが無い状態で起動しないよう、init の正常終了を待つ。
      opensearch-init:
        condition: service_completed_successfully
    ports:
      # ループバックのみ(ファイル冒頭の「公開範囲」を参照)。認証がないため、0.0.0.0 へは公開しない。
      # コンテナ内のポート(8000)は固定で、ホスト側だけ .env の INDEXER_HOST_PORT で変えられる。
      - "127.0.0.1:${INDEXER_HOST_PORT:-8000}:8000"
    # 起動時に OpenSearch へ到達できないとプロセスが終了する設計のため、再起動ポリシーが必要。
    restart: unless-stopped
    # SIGTERM 後、実行中の削除バッチの完了を待つため。Docker の既定 10 秒では足りないことがある。
    stop_grace_period: 30s
    # healthcheck は、イメージの HEALTHCHECK(/healthz、start-period 120 秒)をそのまま使う。

  crawler:
    build: ../../apps/crawler
    environment:
      # 必須の 3 項目。owner はロックの所有者で、再起動の前後で同じ値にする(単一 Crawler の MVP)。
      LORELEY_CRAWLER_OWNER: crawler-1
      LORELEY_CRAWLER_OPENSEARCH_URL: http://opensearch:9200
      LORELEY_CRAWLER_INDEXER_URL: http://indexer:8000
      LORELEY_CRAWLER_LOG_LEVEL: ${CRAWLER_LOG_LEVEL:-INFO}
      # Indexer・opensearch-init と同じ値にする(ファイル冒頭の「上限・索引名の同値定義」)。
      LORELEY_CRAWLER_JOBS_INDEX_NAME: ${LORELEY_JOBS_INDEX_NAME:-loreley-jobs}
      LORELEY_CRAWLER_SOURCES_INDEX_NAME: ${LORELEY_SOURCES_INDEX_NAME:-loreley-sources}
      # api と同じ値にする(ファイル冒頭の「Crawler と api の同値定義」)。
      LORELEY_CRAWLER_TIMEZONE: ${LORELEY_CRON_TIMEZONE:-UTC}
      LORELEY_CRAWLER_ADMITTING_LOCK_GRACE_SECONDS: ${LORELEY_ADMITTING_LOCK_GRACE_SECONDS:-60}
      # Indexer の上限(起動時の整合性検査用)。Indexer の `LORELEY_INDEXER_*` と同じ変数・同じ値。
      # 渡さないと検査が省略され、上限を超える設定でも起動できてしまう(警告が出るだけ)。
      LORELEY_CRAWLER_INDEXER_MAX_RAW_BYTES: ${INDEXER_MAX_RAW_BYTES:-20971520}
      LORELEY_CRAWLER_INDEXER_MAX_BATCH_DOCUMENTS: ${INDEXER_MAX_BATCH_DOCUMENTS:-50}
      LORELEY_CRAWLER_INDEXER_MAX_BATCH_BYTES: ${INDEXER_MAX_BATCH_BYTES:-67108864}
      LORELEY_CRAWLER_INDEXER_MAX_REQUEST_BODY_BYTES: ${INDEXER_MAX_REQUEST_BODY_BYTES:-104857600}
      LORELEY_CRAWLER_INDEXER_MAX_LAST_SEEN_IDS: ${INDEXER_MAX_LAST_SEEN_IDS:-1000}
      LORELEY_CRAWLER_INDEXER_SKIP_OVERSIZE_ID_LIMIT: ${INDEXER_SKIP_OVERSIZE_ID_LIMIT:-10000}
    volumes:
      # 検索対象のディレクトリ。Crawler は原本を書き換えないので読み取り専用で mount する。
      # コンテナ内は /data/documents 固定で、データソース設定の connector_config の root に書く。
      # Crawler は uid 10001 で動くため、ファイルは others が読める権限(ディレクトリは実行権限も)にする。
      # `:?` は付けない: crawler を起動しないとき(Indexer だけの起動など)も、compose は全サービスを
      # 解釈するので、未設定を失敗にすると Indexer 用の手順まで壊れる。
      - ${CRAWLER_DOCUMENTS_DIR:-./documents}:/data/documents:ro
    depends_on:
      opensearch:
        condition: service_healthy
      # 索引(loreley-sources・loreley-jobs)が無い状態で起動しないよう、init の正常終了を待つ。
      opensearch-init:
        condition: service_completed_successfully
      # Indexer の起動は待たなくても動く設計だが(接続エラーはリトライ対象)、起動直後のクロールが
      # 失敗しないよう、healthy を待つ。
      indexer:
        condition: service_healthy
    # ports は定義しない(設計書 crawler-architecture 10 章: ホストに公開しない)。Crawler API は認証がなく、
    # FileSystem Connector の root はコンテナ内の任意のパスを受け付けるため、ホストから呼べると、コンテナ内の
    # 読めるファイルを列挙対象にされうる。結合テストだけが、tests/integration/crawler/compose.test.yaml で
    # ループバックに publish する。
    # 起動時に OpenSearch へ到達できない・設定が不正だとプロセスが終了する設計のため、再起動ポリシーが必要。
    restart: unless-stopped
    # SIGTERM 後、uvicorn・Scheduler・Job Runner の停止を待つため。Docker の既定 10 秒では足りない
    # ことがある(Dockerfile のコメント参照。30 秒以上にする)。
    stop_grace_period: 30s
    # healthcheck は、イメージの HEALTHCHECK(/healthz、start-period 180 秒)をそのまま使う。
    # 起動時の回復(OpenSearch への読み書き)が終わるまで接続できないため、start-period が長い。

  api:
    build: ../../apps/api
    environment:
      # 接続先。コンテナ間は内部ネットワークのサービス名で通信する(Crawler・Indexer の `/healthz` も読む)。
      LORELEY_API_OPENSEARCH_URL: http://opensearch:9200
      LORELEY_API_CRAWLER_URL: http://crawler:8001
      LORELEY_API_INDEXER_URL: http://indexer:8000
      # web(Nginx)の確認先。api は {URL}/admin/ の 200 で web の死活を判定する(EP-13)。
      LORELEY_API_WEB_URL: http://web:80
      LORELEY_API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      # 索引名。Crawler・Indexer・opensearch-init と同じ変数から渡す(ファイル冒頭の「上限・索引名の同値定義」)。
      LORELEY_API_SOURCES_INDEX_NAME: ${LORELEY_SOURCES_INDEX_NAME:-loreley-sources}
      LORELEY_API_JOBS_INDEX_NAME: ${LORELEY_JOBS_INDEX_NAME:-loreley-jobs}
      LORELEY_API_DELETIONS_INDEX_NAME: ${LORELEY_DELETIONS_INDEX_NAME:-loreley-deletions}
      # 検索インデックスの名前には、実体名(opensearch-init の SEARCH_INDEX_NAME)でなくエイリアスを渡す。
      LORELEY_API_SEARCH_INDEX_NAME: ${LORELEY_SEARCH_INDEX_ALIAS:-loreley-documents}
      # Crawler と同じ値にする(ファイル冒頭の「Crawler と api の同値定義」)。
      LORELEY_API_CRON_TIMEZONE: ${LORELEY_CRON_TIMEZONE:-UTC}
      LORELEY_API_ADMITTING_LOCK_GRACE_SECONDS: ${LORELEY_ADMITTING_LOCK_GRACE_SECONDS:-60}
      # OPENAPI_ENABLED は設定しない(既定の無効のまま)。
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      # crawler・indexer・web は待たない。落ちていても、api は起動して画面にその異常を表示する。
    # ports は定義しない(ファイル冒頭の「公開範囲」を参照)。ホストへは公開せず、web 経由(/api/)で使う。
    # api の /healthz をホストから確認するときは、`docker compose exec api python -c ...`(README 参照)。
    restart: unless-stopped
    # 検索対象のディレクトリは mount しない(読み取り専用でも mount するのは crawler だけ)。
    # healthcheck は、イメージの HEALTHCHECK(/healthz、start-period 10 秒)をそのまま使う。

  web:
    build: ../../apps/web
    ports:
      # ループバックのみ(ファイル冒頭の「公開範囲」を参照)。認証がないため、0.0.0.0 へは公開しない。
      # コンテナ内のポート(80)は固定で、ホスト側だけ .env の WEB_HOST_PORT で変えられる。
      - "127.0.0.1:${WEB_HOST_PORT:-8090}:80"
    depends_on:
      # nginx は api が未起動でも起動できる(名前解決は実行時)が、起動直後の /api/ が 502 にならないよう、
      # api の healthy を待つ。api は web を待たない。
      api:
        condition: service_healthy
    restart: unless-stopped
    # healthcheck は、イメージの HEALTHCHECK(/admin/ の 200)をそのまま使う。同じ /admin/ を、api の
    # Dashboard(EP-13)の web の判定も確認する。

volumes:
  opensearch-data:
