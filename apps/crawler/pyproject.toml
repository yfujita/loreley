[project]
name = "loreley-crawler"
version = "0.1.0"
description = "Loreley Crawler: データソースの巡回・Indexer への登録依頼・ジョブとロックの管理を担う"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cronsim>=2.7,<2.8",
    "fastapi>=0.115,<1",
    "opensearch-py>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "urllib3>=2.2,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loreley_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
