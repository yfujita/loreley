[project]
name = "loreley-api"
version = "0.1.0"
description = "Loreley API: Admin API・将来の Search API・MCP Server の共通の土台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.16,<5",
    "fastapi>=0.143.2,<1",
    "opensearch-py>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # CRON_TIMEZONE の IANA 名の検証に使う。slim イメージに OS の zoneinfo がなくても動くよう直接依存にする。
    # CalVer なので、年初に上限を見直す。
    "tzdata>=2026.6,<2027",
    "urllib3>=2.2,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loreley_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
