# web コンテナ(Nginx)の設定。/admin/ で dist/ を静的配信し、/api/ を api コンテナへ中継する。
# ブラウザから見て同一オリジンなので CORS は要らない。
# 認証・TLS・セキュリティヘッダー(CSP など)は MVP の対象外(`127.0.0.1` のみ公開する前提)。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # リダイレクトの Location を相対(`/admin/`)にする。絶対 URL にすると、コンテナ内のポート(80)が
    # 付き、ホスト側のポートの対応(`127.0.0.1:8090->80`)越しでは届かないため。
    absolute_redirect off;

    # api の本文上限(1 MiB)より少し大きくして、1 MiB 超の判定を api の JSON 400 に任せる。
    # 既定の 1m のままだと、Nginx が HTML の 413 を返して api の JSON が届かない。
    client_max_body_size 2m;

    # 定義したパス以外は 404 にする。書かないと、`root` の直下にある公式イメージの既定ファイル
    # (`/index.html`「Welcome to nginx」・`/50x.html`)が配信される。より長い location(`= /`・
    # `/admin/`・`/api/` など)が優先されるので、これらには影響しない。
    location / {
        return 404;
    }

    # Search View の置き場が決まるまでの暫定。書かないと既定の「Welcome to nginx」が出る。
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # SPA のフォールバック。assets/ 以外の欠落ファイルも index.html(200)になる(許容する)。
    # index.html は常に再検証させる。再配備で古いチャンクが消えると、開いたままのタブの
    # 動的 import が失敗するため。
    # add_header は子 location に継承されないので、location ごとに書く。
    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # ハッシュ付きのファイルは長期キャッシュする。欠落は 404 にする(index.html を返すと、
    # HTML が JS として読まれる紛らわしい失敗になるため)。
    # 404 に Cache-Control を付けない(`add_header` に `always` を付けない)ので、
    # 欠落が長期キャッシュされない。
    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    }

    # `/api`(末尾スラッシュなし)は、この location への Nginx 既定の 301 `/api/` になる。
    location /api/ {
        # api の名前解決を実行時に行う。`proxy_pass` にホスト名を直接書くと、api が未起動の
        # 起動順で `host not found in upstream` となり nginx が起動できない。
        # 127.0.0.11 は Docker の内部 DNS(user-defined network のみ。既定の bridge では使えない)。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        # URI 部を付けない。元のリクエスト URI(`%2F`・`%2E` を含む)をそのまま渡す。
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # api は書き込みで Crawler を接続 3 秒+応答 60 秒(約 63 秒)待ち、結果不明を示す JSON の 504
        # (`crawler_response_lost`)を返す。それより先に切れると HTML の 504 になり、結果不明が
        # 伝わらない。api の Crawler 待ちの設定を上げたときは、これも合わせて上げる。
        proxy_read_timeout 90s;

        # proxy_cache・add_header・error_page は置かない。api の `Cache-Control: no-store` を
        # 素通しし、502・503・504・413 は Nginx の HTML のままフロントが扱う。
    }
}
